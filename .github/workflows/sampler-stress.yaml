# Long-running fits of the CAPM regression example across operating systems.
# Each fit must finish within the step timeout; a stalled sampler fails the job.
# Run manually from the Actions tab.
on:
  workflow_dispatch:

name: sampler-stress

permissions: read-all

jobs:
  capm:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} seed ${{ matrix.seed }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        seed: [1000, 8, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
      - name: Fit CAPM example (reviewer settings)
        timeout-minutes: 30
        run: Rscript .github/stress/capm_stress.R ${{ matrix.seed }}
